# Quand une PR Renovate modifie app/pnpm-lock.yaml, le hash des dépendances
# dans nix/app.nix devient faux. Ce workflow le recalcule et le pousse sur la branche.
name: Hash pnpm pour Nix

on:
  pull_request:
    paths: [app/pnpm-lock.yaml, app/package.json]

permissions:
  contents: write
  actions: write

jobs:
  update:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: cachix/install-nix-action@v31
      - name: Recalculer le hash
        run: |
          got=$(nix build .#app.pnpmDeps --no-link 2>&1 | sed -n 's/.*got: *\(sha256-[^ ]*\).*/\1/p' | head -1)
          if [ -z "$got" ]; then echo "Hash déjà à jour."; exit 0; fi
          sed -i "s|hash = \"sha256-[^\"]*\";|hash = \"$got\";|" nix/app.nix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "build(nix): mettre à jour le hash des dépendances pnpm"
          git push
          # Un push fait avec GITHUB_TOKEN ne relance pas la CI : on la relance explicitement.
          gh workflow run ci.yml --ref "${{ github.head_ref }}"
        env:
          GH_TOKEN: ${{ github.token }}
