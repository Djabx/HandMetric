[package]
name = "lifelog-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Serveur de synchronisation auto-hébergé de LifeLog"

[dependencies]
anyhow = "1.0.105"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.9", features = ["derive", "env"] }
openidconnect = { version = "4.1.0", default-features = false, features = ["reqwest", "rustls-tls"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "any", "postgres", "sqlite", "migrate"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.2"
tower-http = { version = "0.7.1", features = ["fs", "trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4", "v7"] }
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation", "conditional-ui"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"

[profile.release]
lto = "thin"
strip = true
